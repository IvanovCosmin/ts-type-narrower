name: Release npm packages

# Publishes on version tags (v0.1.0). Requires the NPM_TOKEN repository
# secret (an npm automation token for an account that owns the package
# names). Versions in Cargo.toml, npm/overwide/package.json, and
# npm/eslint-plugin-overwide/package.json must all match the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm --provenance

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - npm_pkg: overwide-linux-x64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04 # oldest runner glibc for widest compat
          - npm_pkg: overwide-linux-x64-musl
            target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - npm_pkg: overwide-linux-arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - npm_pkg: overwide-darwin-x64
            target: x86_64-apple-darwin
            os: macos-13
          - npm_pkg: overwide-darwin-arm64
            target: aarch64-apple-darwin
            os: macos-14
          - npm_pkg: overwide-win32-x64
            target: x86_64-pc-windows-msvc
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.npm_pkg == 'overwide-linux-x64-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.npm_pkg }}
          path: target/${{ matrix.target }}/release/overwide${{ matrix.npm_pkg == 'overwide-win32-x64' && '.exe' || '' }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: binaries
      - name: Check versions match the tag
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          npm_v=$(node -p "require('./npm/overwide/package.json').version")
          plugin_v=$(node -p "require('./npm/eslint-plugin-overwide/package.json').version")
          plugin_dep=$(node -p "require('./npm/eslint-plugin-overwide/package.json').dependencies.overwide")
          echo "tag=$tag cargo=$cargo_v npm=$npm_v plugin=$plugin_v plugin_dep=$plugin_dep"
          test "$tag" = "$cargo_v" -a "$tag" = "$npm_v" -a "$tag" = "$plugin_v" -a "$tag" = "$plugin_dep"
      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in overwide-linux-x64 overwide-linux-x64-musl overwide-linux-arm64 \
                     overwide-darwin-x64 overwide-darwin-arm64 overwide-win32-x64; do
            bin=$(ls binaries/$pkg/overwide*)
            node scripts/make-platform-package.mjs "$pkg" "$bin" "dist/$pkg"
            npm publish "dist/$pkg" --access public --provenance
          done
      - name: Publish overwide
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish npm/overwide --access public --provenance
      - name: Publish eslint-plugin-overwide
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish npm/eslint-plugin-overwide --access public --provenance
