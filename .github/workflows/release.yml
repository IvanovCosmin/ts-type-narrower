name: Release npm packages

# Publishes on version tags (v0.1.0). Requires the NPM_TOKEN repository
# secret (an npm automation token for an account that owns the package
# names). Versions in Cargo.toml, npm/type-narrower/package.json, and
# npm/eslint-plugin-type-narrower/package.json must all match the tag.
on:
  push:
    tags: ["v*"]
    # The tooling that pushes from CI sessions cannot push tags; a release/*
    # branch is the equivalent trigger (the tag-version check only runs for
    # tag refs — branch-triggered runs publish the manifest versions as-is).
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm --provenance

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - npm_pkg: type-narrower-linux-x64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04 # oldest runner glibc for widest compat
          - npm_pkg: type-narrower-linux-x64-musl
            target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - npm_pkg: type-narrower-linux-arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - npm_pkg: type-narrower-darwin-x64
            target: x86_64-apple-darwin
            # Intel runners (macos-13) are retired; cross-compile on arm64.
            os: macos-14
          - npm_pkg: type-narrower-darwin-arm64
            target: aarch64-apple-darwin
            os: macos-14
          - npm_pkg: type-narrower-win32-x64
            target: x86_64-pc-windows-msvc
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.npm_pkg == 'type-narrower-linux-x64-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.npm_pkg }}
          path: target/${{ matrix.target }}/release/type-narrower${{ matrix.npm_pkg == 'type-narrower-win32-x64' && '.exe' || '' }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # failure-log branch below; publishing itself only reads
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: binaries
      - name: Check versions match the tag
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          npm_v=$(node -p "require('./npm/type-narrower/package.json').version")
          plugin_v=$(node -p "require('./npm/eslint-plugin-type-narrower/package.json').version")
          plugin_dep=$(node -p "require('./npm/eslint-plugin-type-narrower/package.json').dependencies.type-narrower")
          echo "tag=$tag cargo=$cargo_v npm=$npm_v plugin=$plugin_v plugin_dep=$plugin_dep"
          test "$tag" = "$cargo_v" -a "$tag" = "$npm_v" -a "$tag" = "$plugin_v" -a "$tag" = "$plugin_dep"
      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in type-narrower-linux-x64 type-narrower-linux-x64-musl type-narrower-linux-arm64 \
                     type-narrower-darwin-x64 type-narrower-darwin-arm64 type-narrower-win32-x64; do
            bin=$(ls binaries/$pkg/type-narrower*)
            node scripts/make-platform-package.mjs "$pkg" "$bin" "dist/$pkg"
            # npm parses a bare name/name argument as a GitHub shorthand, not a
            # folder — publish from inside the directory instead.
            (cd "dist/$pkg" && npm publish --access public --provenance)
          done
      - name: Publish type-narrower
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: cd npm/type-narrower && npm publish --access public --provenance
      - name: Publish eslint-plugin-type-narrower
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: cd npm/eslint-plugin-type-narrower && npm publish --access public --provenance
      - name: Push npm error log to ci-logs branch on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          log=$(ls -t /home/runner/.npm/_logs/*.log 2>/dev/null | head -1)
          { [ -n "$log" ] && tail -c 40000 "$log"; } > /tmp/npmlog.txt || echo "no npm debug log found" > /tmp/npmlog.txt
          sha=$(curl -s -H "Authorization: Bearer $GH_TOKEN"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main"             | python3 -c "import json,sys; print(json.load(sys.stdin)['object']['sha'])")
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs"             -d "{"ref":"refs/heads/ci-logs","sha":"$sha"}" | head -c 120 || true
          b64=$(base64 -w0 /tmp/npmlog.txt)
          curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/npm-error-${GITHUB_RUN_ID}.log"             -d "{"message":"ci npm error log ${GITHUB_RUN_ID}","branch":"ci-logs","content":"$b64"}" | head -c 200
